  <script>
    
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const CAM = $('#s03-cam');
    const CUR = $('#s03-cur');
    const CX = 960, CY = 365, CB = 1.5;
    // Coordinate "mondo" di un elemento (centro di default), indipendenti dalla camera attuale.
    function W(sel, fx, fy) {
      fx = fx === undefined ? 0.5 : fx; fy = fy === undefined ? 0.5 : fy;
      const e = $(sel), r = e.getBoundingClientRect(), c = CAM.getBoundingClientRect();
      const k = (c.width / CAM.offsetWidth) || 1;
      return { x: (r.left - c.left + r.width * fx) / k, y: (r.top - c.top + r.height * fy) / k };
    }
    let camS = 1;
    // Mette al centro dell'area libera (sopra i sottotitoli) il centro di un elemento, a scala s.
    function centerOn(sel, s, dx, dy) { const p = W(sel); viewSet(p.x + (dx || 0), p.y + (dy || 0), s); return p; }
    function viewSet(wx, wy, s) {
      camS = s;
      gsap.set(CAM, { x: CX - wx * s, y: CY - wy * s, scale: s });
      if (CUR) gsap.set(CUR, { scale: CB / s });
    }
    function view(t, d, wx, wy, s, ease) {
      ease = ease || 'power2.inOut';
      tl.to(CAM, { x: CX - wx * s, y: CY - wy * s, scale: s, duration: d, ease: ease }, t);
      if (CUR) tl.to(CUR, { scale: CB / s, duration: d, ease: ease }, t);
      camS = s;
    }
    // Il cursore: compare, si muove verso un punto del mondo, "clicca".
    function curAt(x, y) { gsap.set(CUR, { x: x, y: y, scale: CB / camS }); }
    function curShow(t, on) { tl.to(CUR, { opacity: on === false ? 0 : 1, duration: 0.2 }, t); }
    function curTo(t, d, p, ease) { tl.to(CUR, { x: p.x, y: p.y, duration: d, ease: ease || 'power3.inOut' }, t); }
    function tap(t) {
      const ci = CUR.firstElementChild;
      tl.to(ci, { scale: 0.8, duration: 0.07, ease: 'power2.out' }, t);
      tl.to(ci, { scale: 1, duration: 0.14, ease: 'power2.out' }, t + 0.07);
    }
    function press(t, sel) {
      tl.to(sel, { scale: 0.96, duration: 0.07, ease: 'power2.out', transformOrigin: '50% 50%' }, t);
      tl.to(sel, { scale: 1, duration: 0.16, ease: 'power2.out' }, t + 0.07);
    }
    // Scrive un testo già diviso in span (vedi typed()): un carattere ogni 1/cps secondi.
    function write(t, sel, cps) {
      const sp = $$(sel + ' > span');
      tl.to(sp, { opacity: 1, duration: 0.01, stagger: 1 / (cps || 16) }, t);
      return t + sp.length / (cps || 16);
    }
    // Entrata/uscita della scena: dissolvenza morbida.
    function sceneInOut(dur, tin, tout) {
      tin = tin === undefined ? 0.35 : tin; tout = tout === undefined ? 0.35 : tout;
      if (tin > 0) tl.fromTo('#s03-all', { opacity: 0 }, { opacity: 1, duration: tin, ease: 'power2.out' }, 0);
      tl.to('#s03-all', { opacity: 0, duration: tout, ease: 'power2.in' }, dur - tout);
    }
  
    // Prima si misura (le entrate spostano gli elementi), poi si anima.
    const win = W('#s03-win'), av = W('#s03-av'), pb = W('#s03-av-prendi');
    sceneInOut(22.4, 0.35, 0.4);
    viewSet(win.x, win.y + 8, 1.2);
    tl.fromTo('#s03-win', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.2);
    // L'avviso entra dal basso, com'è nell'app.
    tl.fromTo('#s03-av', { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 1.5);
    // La camera si avvicina all'avviso.
    view(4.2, 1.0, av.x, av.y + 4, 2.0);
    // Il blocco trattativa va dove sta l'avviso.
    gsap.set('#s03-blk', { x: av.x - 235, y: av.y - 110 });
    // Il cursore va su «Prendi in carico».
    curAt(av.x + 120, av.y + 190);
    curShow(11.9, true);
    curTo(12.0, 1.6, { x: pb.x, y: pb.y });
    press(13.75, '#s03-av-prendi');
    tap(13.75);
    // L'avviso si chiude; compare il blocco della trattativa, che cambia stato.
    tl.to('#s03-av', { opacity: 0, y: 14, duration: 0.3, ease: 'power2.in' }, 14.05);
    curShow(14.0, false);
    tl.fromTo('#s03-blk', { opacity: 0, y: av.y - 100 }, { opacity: 1, y: av.y - 110, duration: 0.5, ease: 'power3.out' }, 14.2);
    // Dopo un secondo di «Da prendere in carico», passa a «In gestione».
    const T = 15.7;
    tl.to('#s03-t', { backgroundColor: 'rgba(53,86,107,0.08)', duration: 0.4 }, T);
    tl.to('#s03-t-badge', { opacity: 0, duration: 0.12 }, T);
    tl.set('#s03-t-badge', { innerHTML: 'In gestione', className: 'badge badge-stato badge-punto badge-info' }, T + 0.12);
    tl.to('#s03-t-badge', { opacity: 1, duration: 0.2 }, T + 0.13);
    tl.set('#s03-t-chi', { innerHTML: 'la segui tu' }, T + 0.12);
    tl.set('#s03-t-az', { innerHTML: 'in corso: continua il seguito' }, T + 0.12);
    tl.to('#s03-t-prendi', { opacity: 0, duration: 0.2 }, T);
    
    tl.fromTo('#s03-cap0', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 0.9);
    tl.to('#s03-cap0', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 4.920);
    tl.fromTo('#s03-cap1', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 4.9);
    tl.to('#s03-cap1', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 10.420);
    tl.fromTo('#s03-cap2', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 10.7);
    tl.to('#s03-cap2', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 13.820);
    tl.fromTo('#s03-cap3', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 14.9);
    tl.to('#s03-cap3', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 18.920);
    tl.fromTo('#s03-cap4', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 19.3);
    tl.to('#s03-cap4', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 21.520);
