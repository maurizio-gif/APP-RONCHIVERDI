  <script>
    
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const CAM = $('#s17-cam');
    const CUR = $('#s17-cur');
    const CX = 960, CY = 365, CB = 1.5;
    // Coordinate "mondo" di un elemento (centro di default), indipendenti dalla camera attuale.
    function W(sel, fx, fy) {
      fx = fx === undefined ? 0.5 : fx; fy = fy === undefined ? 0.5 : fy;
      const e = $(sel), r = e.getBoundingClientRect(), c = CAM.getBoundingClientRect();
      const k = (c.width / CAM.offsetWidth) || 1;
      return { x: (r.left - c.left + r.width * fx) / k, y: (r.top - c.top + r.height * fy) / k };
    }
    let camS = 1;
    // Mette al centro dell'area libera (sopra i sottotitoli) il centro di un elemento, a scala s.
    function centerOn(sel, s, dx, dy) { const p = W(sel); viewSet(p.x + (dx || 0), p.y + (dy || 0), s); return p; }
    function viewSet(wx, wy, s) {
      camS = s;
      gsap.set(CAM, { x: CX - wx * s, y: CY - wy * s, scale: s });
      if (CUR) gsap.set(CUR, { scale: CB / s });
    }
    function view(t, d, wx, wy, s, ease) {
      ease = ease || 'power2.inOut';
      tl.to(CAM, { x: CX - wx * s, y: CY - wy * s, scale: s, duration: d, ease: ease }, t);
      if (CUR) tl.to(CUR, { scale: CB / s, duration: d, ease: ease }, t);
      camS = s;
    }
    // Il cursore: compare, si muove verso un punto del mondo, "clicca".
    function curAt(x, y) { gsap.set(CUR, { x: x, y: y, scale: CB / camS }); }
    function curShow(t, on) { tl.to(CUR, { opacity: on === false ? 0 : 1, duration: 0.2 }, t); }
    function curTo(t, d, p, ease) { tl.to(CUR, { x: p.x, y: p.y, duration: d, ease: ease || 'power3.inOut' }, t); }
    function tap(t) {
      const ci = CUR.firstElementChild;
      tl.to(ci, { scale: 0.8, duration: 0.07, ease: 'power2.out' }, t);
      tl.to(ci, { scale: 1, duration: 0.14, ease: 'power2.out' }, t + 0.07);
    }
    function press(t, sel) {
      tl.to(sel, { scale: 0.96, duration: 0.07, ease: 'power2.out', transformOrigin: '50% 50%' }, t);
      tl.to(sel, { scale: 1, duration: 0.16, ease: 'power2.out' }, t + 0.07);
    }
    // Scrive un testo già diviso in span (vedi typed()): un carattere ogni 1/cps secondi.
    function write(t, sel, cps) {
      const sp = $$(sel + ' > span');
      tl.to(sp, { opacity: 1, duration: 0.01, stagger: 1 / (cps || 16) }, t);
      return t + sp.length / (cps || 16);
    }
    // Entrata/uscita della scena: dissolvenza morbida.
    function sceneInOut(dur, tin, tout) {
      tin = tin === undefined ? 0.35 : tin; tout = tout === undefined ? 0.35 : tout;
      if (tin > 0) tl.fromTo('#s17-all', { opacity: 0 }, { opacity: 1, duration: tin, ease: 'power2.out' }, 0);
      tl.to('#s17-all', { opacity: 0, duration: tout, ease: 'power2.in' }, dur - tout);
    }
  
    const mp = W('#s17m'), r = W('#s17m-r'), nuovo = W('#s17-nuovo'), fields = W('#s17-fields', 0.5, 0.2), cont = W('#s17-cont'),
          card = W('#s17-card', 0.5, 0.0), nome = W('#s17-nome');
    sceneInOut(23.6, 0.35, 0.4);
    viewSet(mp.x + 40, mp.y + 70, 2.0);
    tl.fromTo('#s17-pg', { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.2);
    // Programma → Registra (cambia la spiegazione)
    curAt(r.x + 150, r.y + 90);
    curShow(4.8, true);
    curTo(4.9, 0.7, { x: r.x, y: r.y });
    tap(5.7); press(5.7, '#s17m-r');
    tl.set('#s17m-p', { className: 'btn btn-sm btn-ghost' }, 5.75);
    tl.set('#s17m-r', { className: 'btn btn-sm' }, 5.75);
    tl.set('#s17m-hint', { innerHTML: 'Qualcosa che hai già fatto: nasce chiusa, con l’esito e la nota di com’è andata.' }, 5.75);
    // Nuovo contatto: compaiono i campi
    view(8.8, 0.9, cont.x + 20, cont.y + 120, 1.85);
    curTo(9.4, 0.8, { x: nuovo.x, y: nuovo.y });
    tap(10.3); press(10.3, '#s17-nuovo');
    tl.set('#s17-dall', { className: 'btn btn-sm btn-ghost' }, 10.35);
    tl.set('#s17-nuovo', { className: 'btn btn-sm' }, 10.35);
    tl.set('#s17-conthint', { innerHTML: 'Basta il nome: entra in anagrafica adesso, segnato come inserito a mano. Se ci fosse già — stessa email o stesso numero — la voce va sulla scheda che c’è, senza doppioni.' }, 10.35);
    tl.to('#s17-fields', { opacity: 1, duration: 0.4 }, 10.6);
    write(11.4, '#s17-nome', 12);
    curShow(12.8, false);
    // il banner finale
    view(17.0, 1.0, card.x, card.y - 70, 2.0);
    tl.to('#s17-card', { opacity: 0, duration: 0.25 }, 17.3);
    tl.set('#s17-card', { display: 'none' }, 17.6);
    tl.set(['#s17-banner', '#s17-btnw'], { display: 'flex' }, 17.6);
    tl.fromTo(['#s17-banner', '#s17-btnw'], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out', stagger: 0.12 }, 17.65);
    
    tl.fromTo('#s17-cap0', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 0.8);
    tl.to('#s17-cap0', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 4.820);
    tl.fromTo('#s17-cap1', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 5.1);
    tl.to('#s17-cap1', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 9.420);
    tl.fromTo('#s17-cap2', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 9.7);
    tl.to('#s17-cap2', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 13.120);
    tl.fromTo('#s17-cap3', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 13.4);
    tl.to('#s17-cap3', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 17.720);
    tl.fromTo('#s17-cap4', { opacity: 0, y: 16, filter: 'blur(7px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'power3.out' }, 18);
    tl.to('#s17-cap4', { opacity: 0, filter: 'blur(7px)', duration: 0.18, ease: 'power3.in' }, 22.820);
  
    window.__timelines['s17'] = tl;
  </script>
